[package]
name = "craft-ai-engine-burn"
description = "SAM 2.1 on the Burn engine for Craft AI: an optional graphics-card runner for image.segment, reading weights prepared once on this computer. Native only."
version.workspace = true
edition.workspace = true
license.workspace = true
# Burn 0.22 needs a newer compiler than the rest of the workspace.
rust-version = "1.95"
repository.workspace = true
publish = false

[dependencies]
craft-ai-core.workspace = true
craft-ai-engine = { path = "../ai-engine", package = "craft-ai-engine" }
# The request handling (clicks, box, the picture kept between requests, the empty-mask answer),
# picture decoding and resampling are engine-neutral and live there once.
craft-ai-engine-rten = { path = "../ai-engine-rten", package = "craft-ai-engine-rten" }
# `wgpu` reaches Vulkan, Metal and DirectX 12 cards; `ndarray` is the processor fallback.
burn = { version = "=0.22.1", default-features = false, features = ["std", "ndarray", "wgpu"] }
burn-store = "=0.22.1"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
png = "0.18"

[lints]
workspace = true
